kind = "mobile"
previewPath = "/"
title = "Wheel Spinner"
description = "A mobile decision wheel app with meal, exercise, weekend, and custom spinners, plus native sharing for every result."
version = "1.0.0"
id = "artifacts/wheel-spinner"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24205

[services.development]
run = "pnpm --filter @workspace/wheel-spinner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wheel-spinner", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wheel-spinner", "run", "serve" ]

[services.env]
PORT = "24205"
BASE_PATH = "/"
